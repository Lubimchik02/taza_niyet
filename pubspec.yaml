name: taza_niyet
description: Taza Niyet — волонтёрские квесты, команды и портфолио.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.0
  shared_preferences: ^2.2.0
  flutter_map: ^7.0.0
  share_plus: ^10.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  supabase_flutter: ^2.8.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

# Нативная заставка (показывается мгновенно, до запуска Flutter): `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#F4F7EC"
  color_dark: "#10160B"
  image: assets/brand/splash_leaf.png
  android_12:
    color: "#F4F7EC"
    color_dark: "#10160B"
    image: assets/brand/splash_leaf_android12.png
