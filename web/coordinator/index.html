:root{--bg:#F4F7EC;--surface:#fff;--s2:#EEF3E3;--outline:#E2E9D5;--text:#1D2A10;--t2:#5E6E4C;--pr:#8CC914;--onpr:#1F3300;--prs:#3D6B00;--lime:#DDFF99;--danger:#B3261E;--warn:#8A5A00;--warnbg:#FFF1D6;--r:18px;--fast:150ms;--ease:cubic-bezier(.2,0,0,1)}

body{font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--outline);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}.brand svg{width:34px;height:34px;color:var(--pr)}.brand b{font-size:19px;font-weight:800}.brand small{display:block;color:var(--t2);font-size:12px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;cursor:pointer;font-weight:600;color:var(--t2);text-align:left}
.nav:hover{background:var(--s2)}.nav[aria-current=page]{background:var(--lime);color:var(--text)}.nav .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.nav svg,.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
main{padding:28px 32px 64px;max-width:1120px;width:100%}
h1{font-size:28px;margin:0 0 4px;font-weight:800}h2{font-size:20px;margin:28px 0 12px}h3{margin:0;font-size:17px}
.lead{color:var(--t2);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);padding:16px}
.stat{cursor:pointer;text-align:left;width:100%}.stat:hover{border-color:var(--pr)}.stat b{display:block;font-size:32px;font-weight:800;color:var(--prs)}.stat span{color:var(--t2);font-weight:600;font-size:14px}.stat.alert b{color:var(--danger)}
.row{display:flex;align-items:center;gap:12px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.t2{color:var(--t2)}.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:0;cursor:pointer;font-weight:700;white-space:nowrap;transition:transform var(--fast) var(--ease)}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.38;cursor:default}
.p{background:var(--pr);color:var(--onpr)}.s{background:var(--s2)}.g{background:none;color:var(--prs)}.d{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.av{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--prs);display:grid;place-items:center;font-weight:800;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--s2);color:var(--t2)}
.badge.minor{background:#E8EEFF;color:#2B4AA8}.dark .badge.minor{background:#1E2A4A;color:#AFC3FF}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.ok{background:var(--lime);color:var(--prs)}.badge.bad{background:#FDE7E5;color:var(--danger)}.dark .badge.bad{background:#3B1A18}
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;font-size:13px;color:var(--t2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--outline)}td{padding:10px;border-bottom:1px solid var(--outline);vertical-align:middle}tr.manual td{background:var(--warnbg)}tr.absent td{color:var(--t2)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}.fld input,.fld select,.fld textarea{min-height:44px;border:1.5px solid var(--outline);border-radius:12px;background:var(--surface);padding:10px 12px;font-weight:500}.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pr);outline:none}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:4px;gap:4px}.seg button{border:0;background:none;border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;color:var(--t2);cursor:pointer}.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0002}
.empty{text-align:center;padding:40px 16px;color:var(--t2)}.empty svg{width:44px;height:44px;color:var(--pr);margin-bottom:8px}
.code{font:800 26px/1 ui-monospace,Menlo,monospace;letter-spacing:3px}
.demo{background:var(--warnbg);color:var(--warn);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;margin-bottom:20px}
.back{border:0;background:none;color:var(--prs);font-weight:700;cursor:pointer;padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
dialog{border:0;border-radius:24px;padding:24px;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(calc(100% + 40px));opacity:0;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;transition:transform 250ms var(--ease);z-index:99;max-width:90vw}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.login{max-width:400px;margin:12vh auto;padding:0 16px}
.sel{min-height:36px;border:1.5px solid var(--outline);border-radius:10px;background:var(--surface);padding:0 8px}
.msg{white-space:pre-wrap;background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--outline)}.brand,.side-foot{display:none}.nav{white-space:nowrap;width:auto}main{padding:20px 16px 64px}.item .grow{flex-basis:calc(100% - 60px)}.badge{white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

 if(S.token&&S.exp&&Date.now()>S.exp-60e3)await refreshToken();
 const r=await fetch(CFG.url+path,{...opt,headers:{apikey:CFG.key,Authorization:'Bearer '+(S.token||CFG.key),'Content-Type':'application/json',...(opt.headers||{})}});
 if(r.status===401&&retry&&S.refresh){await refreshToken();return http(path,opt,false)}

 if(!r.ok)throw new Error((body&&(body.message||body.msg||body.error_description))||r.statusText);
 return body}

   Q.unshift({id,title:row.title,starts_at:row.starts_at,duration_min:row.duration_min,capacity:row.capacity,joined:0,waitlist:0,status:'published',difficulty:row.difficulty,address:row.address,
    teams:Array.from({length:n},(_,i)=>team(id,i+1,Math.floor(row.capacity/n)+(i<row.capacity%n?1:0),null,0))});return[{id}]}}})();

async function load(page=S.page){
 const o=S.org;S.loading=true;render();
 try{
  S.data.ov=(await rpc('coord_overview',{p_org:o}))[0]; // счётчики в меню — всегда свежие
  if(page==='overview'||page==='requests'||page==='members'||page==='quests')S.data.members=await rpc('coord_members',{p_org:o});
  if(page==='requests')S.data.code=await rpc('coord_invite_code',{p_org:o});
  if(page==='quests')S.data.quests=await rpc('coord_quests',{p_org:o});
  if(page==='reports'){S.data.reports=await rpc('coord_reports',{p_org:o,p_status:S.rtab==='sent'?'sent':'approved'});if(S.report)S.data.items=await rpc('coord_report_items',{p_report:S.report})}
  if(page==='abuse'||page==='overview')S.data.abuse=await rpc('coord_abuse',{p_org:o});
 }catch(e){toast(t('err'))}
 S.loading=false;render()}

 root.innerHTML=`<div class="app"><aside aria-label="${t('title')}"><div class="brand">${leaf}<div><b>Taza Niyet</b><small>${t('title')}</small></div></div>

 if(focus){const el=document.getElementById(focus);if(el){el.focus();if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}}}

/* ---------- События ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-page],[data-act],[data-lang]');if(!b)return;
 if(b.dataset.lang!==undefined){L=+b.dataset.lang;localStorage.setItem('tnc_lang',L);render();return}
 if(b.dataset.page){S.page=b.dataset.page;S.report=null;window.scrollTo(0,0);load();return}
 const a=b.dataset.act,id=b.dataset.id,o=S.org;
 switch(a){
  case'theme':S.dark=!S.dark;localStorage.setItem('tnc_dark',S.dark?'1':'0');render();break;
  case'signout':signOut();break;
  case'otp-back':S.otpSent=false;render();break;
  case'approve':act('decide_membership',{p_user:id,p_org:o,p_approve:true},t('approve')+' ✓');break;
  case'reject':act('decide_membership',{p_user:id,p_org:o,p_approve:false},t('reject')+' ✓');break;
  case'copy-link':try{await navigator.clipboard.writeText(b.dataset.v);toast(t('copy')+' ✓')}catch(_){toast(b.dataset.v)}break;
  case'regen':if(confirm(t('regenQ')))act('coord_invite_code',{p_org:o,p_regenerate:true},t('regen')+' ✓');break;
  case'new-quest':{const d=$('#dlg-quest');d.showModal();const inp=d.querySelector('[name=starts_at]');const tm=new Date(Date.now()+864e5);tm.setMinutes(0,0,0);tm.setHours(10);inp.value=new Date(tm-tm.getTimezoneOffset()*6e4).toISOString().slice(0,16);d.querySelector('[name=title]').focus();break}
  case'close-dlg':b.closest('dialog').close();break;
  case'cancel-quest':if(confirm(t('cancelQ')))act('coord_cancel_quest',{p_quest:id},t('cancelled'));break;
  case'rtab':S.rtab=b.dataset.v;S.report=null;load();break;
  case'open-report':S.report=id;load();break;
  case'report-back':S.report=null;load();break;
  case'approve-report':{const id=S.report;S.report=null;act('approve_shift',{p_report:id,p_approve:true},t('hoursDone'));break}
  case'return-report':openNote('return');break;
  case'penalty':openNote('penalty');break;
  case'remove':if(confirm(t('removeQ')))act('coord_remove_member',{p_org:o,p_user:id},t('remove')+' ✓');break;
  case'abuse':act('coord_resolve_abuse',{p_org:o,p_id:+id,p_delete_message:!!b.dataset.del,p_remove_user:!!b.dataset.rm},t('resolved'));break;
 }});
function openNote(kind){const d=$('#dlg-note');d.dataset.kind=kind;$('#dn-t').textContent=kind==='penalty'?t('penalty'):t('returnR');$('#dn-b').textContent=kind==='penalty'?t('penaltyB'):'';$('#dn-amt-l').style.display=kind==='penalty'?'':'none';$('#dn-note').value='';d.showModal();$('#dn-note').focus()}
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.act;
 if(el.id==='orgsel'){S.org=el.value;S.orgName=S.orgs.find(o=>o.id===S.org).name;load();return}
 if(a==='senior')act('coord_assign_senior',{p_team:el.dataset.team,p_user:el.value||null},t('senior')+' ✓');
 if(a==='role')act('coord_set_role',{p_org:S.org,p_user:el.dataset.id,p_role:el.value},t('role')+' ✓')});
document.addEventListener('close',()=>{if(S.deferred){S.deferred=false;setTimeout(render)}},true);
document.addEventListener('input',e=>{if(e.target.id==='msearch'){S.q=e.target.value;render()}});
document.addEventListener('submit',async e=>{const f=e.target;
 if(f.id==='f-otp'){e.preventDefault();S.email=$('#em').value.trim();try{await http('/auth/v1/otp',{method:'POST',body:JSON.stringify({email:S.email,create_user:false})});S.otpSent=true;render();$('#otp').focus()}catch(_){toast(t('err'))}}
 if(f.id==='f-verify'){e.preventDefault();try{const j=await http('/auth/v1/verify',{method:'POST',body:JSON.stringify({type:'email',email:S.email,token:$('#otp').value.trim()})});saveSession(j);S.otpSent=false;await start()}catch(_){toast(t('err'))}}
 if(f.id==='f-quest'){e.preventDefault();const v=Object.fromEntries(new FormData(f));
  const row={org_id:S.org,created_by:me(),title:v.title.trim(),description:v.description.trim(),difficulty:v.difficulty,starts_at:new Date(v.starts_at).toISOString(),duration_min:Math.round(+v.hours*60),capacity:+v.capacity,address:v.address.trim(),lat:+v.lat,lng:+v.lng,status:'published'};
  try{await insertQuest(row);f.closest('dialog').close();toast(t('created'));load()}catch(err){toast(t('err')+' · '+err.message)}}
 if(f.id==='f-post'){e.preventDefault();const body=$('#post').value.trim();if(body)act('coord_post',{p_org:S.org,p_body:body},t('sent'))}
 if(f.id==='f-note'){e.preventDefault();const d=f.closest('dialog'),note=$('#dn-note').value.trim();d.close();
  if(d.dataset.kind==='penalty')act('penalize',{p_report:S.report,p_tz:+$('#dn-amt').value,p_note:note},t('penalized'));
  else{await act('approve_shift',{p_report:S.report,p_approve:false,p_note:note},t('returned'));S.report=null;load()}}});

async function start(){
 if(!DEMO&&!S.token){render();return}
 try{S.orgs=await rpc('coord_orgs');}catch(e){toast(t('err'));S.orgs=[]}
 if(!S.orgs.length){S.notCoord=true;S.token=null;sessionStorage.removeItem('tnc_session');render();return}
 S.org=S.orgs[0].id;S.orgName=S.orgs[0].name;load('overview')}
start();
</script>
</body>
</html>
